name: Security scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history
      # The gitleaks GitHub Action now requires a paid GITLEAKS_LICENSE for
      # organization repos and hard-fails without one. The gitleaks CLI
      # itself is run directly from its release binary instead — same
      # scanner, same rules, same .gitleaks.toml at the repo root.
      - name: Install gitleaks CLI
        run: |
          GL_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: gitleaks (worktree + history)
        run: gitleaks detect --source . --redact --exit-code 1

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history
      - name: trufflehog (filesystem + history)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown
