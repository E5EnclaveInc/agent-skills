name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "README.md"
      - "skills_index.json"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install skills-ref (agentskills.io reference validator)
        run: pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Validate every skill
        run: |
          fail=0
          for d in skills/*/; do
            echo "== $d"
            skills-ref validate "$d" || fail=1
          done
          exit $fail

      - name: Index drift check
        run: |
          python3 scripts/generate-index.py
          git diff --exit-code README.md skills_index.json
